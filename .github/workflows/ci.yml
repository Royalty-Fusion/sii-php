name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', symfony: '6.4' }
          - { php: '8.3', symfony: '7.4' }
          - { php: '8.4', symfony: '7.4' }
          - { php: '8.5', symfony: '6.4' }
          - { php: '8.5', symfony: '7.4' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, openssl, gd, pdo_sqlite, pcntl, posix
          coverage: none
      - name: Fijar versión de Symfony
        run: |
          composer require --no-update --no-interaction "symfony/http-client:${{ matrix.symfony }}.*"
          composer require --dev --no-update --no-interaction \
            "symfony/cache:${{ matrix.symfony }}.*" "symfony/config:${{ matrix.symfony }}.*" \
            "symfony/dependency-injection:${{ matrix.symfony }}.*" "symfony/http-kernel:${{ matrix.symfony }}.*"
      - run: composer update --no-interaction --no-progress --prefer-dist
      # Sólo pruebas unitarias: la suite "certificacion" requiere certificado y CAF reales (variables SII_*).
      - run: vendor/bin/phpunit --testsuite unit

  phpstan:
    name: PHPStan nivel 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, libxml, mbstring, openssl, gd, pdo_sqlite
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpstan analyse --no-progress
